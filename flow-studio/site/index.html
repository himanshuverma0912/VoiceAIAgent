<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Studio</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #2f5d50; --accent-ink: #ffffff; --bad: #a33a2b; --chip: #edf3f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
            --accent: #7fb8a4; --accent-ink: #10201b; --bad: #e07b6b; --chip: #24302c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 10px; margin: 0 6px 4px 0; font-size: 13px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  ul { margin: 0; padding-left: 18px; } li { margin: 2px 0; }
  .muted { color: var(--muted); } .bad { color: var(--bad); }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>Flow Studio</h1>
  <p class="sub">Sign-in check. The flow editor arrives in the next step.</p>
  <div id="app" class="card"><p class="muted">Loading…</p></div>
</main>
<script>
// Sign-in: OpenID Connect Authorization Code flow with PKCE against Keycloak's
// voice-platform realm, which in turn signs people in at the company directory
// over SAML. Tokens are kept in memory only (a reload signs in again silently).
const ORIGIN = location.origin;
const REALM = `${ORIGIN}/auth/realms/voice-platform/protocol/openid-connect`;
const CLIENT_ID = "flow-studio";
const IDP_HINT = "corp-idp"; // go straight to the company sign-in page
let tokens = null;

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const random = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function signIn() {
  const verifier = random(48), state = random(16);
  sessionStorage.setItem("pkce", JSON.stringify({ verifier, state }));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", scope: "openid", redirect_uri: `${ORIGIN}/`,
    state, code_challenge: challenge, code_challenge_method: "S256", kc_idp_hint: IDP_HINT,
  });
  location.assign(`${REALM}/auth?${params}`);
}

async function finishSignIn(params) {
  const saved = JSON.parse(sessionStorage.getItem("pkce") || "null");
  sessionStorage.removeItem("pkce");
  history.replaceState(null, "", "/"); // drop ?code=... from the address bar
  if (!saved || saved.state !== params.get("state")) throw new Error("sign-in state didn't match; please sign in again");
  const resp = await fetch(`${REALM}/token`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code", client_id: CLIENT_ID, code: params.get("code"),
      redirect_uri: `${ORIGIN}/`, code_verifier: saved.verifier,
    }),
  });
  if (!resp.ok) throw new Error(`token exchange failed (${resp.status})`);
  tokens = await resp.json();
}

function signOut() {
  const params = new URLSearchParams({ client_id: CLIENT_ID, post_logout_redirect_uri: `${ORIGIN}/` });
  if (tokens?.id_token) params.set("id_token_hint", tokens.id_token);
  tokens = null;
  location.assign(`${REALM}/logout?${params}`);
}

async function api(path) {
  const resp = await fetch(`/api${path}`, { headers: { Authorization: `Bearer ${tokens.access_token}` } });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || `${path}: ${resp.status}`);
  return body;
}

function renderSignedOut(message) {
  app.innerHTML = `
    <div class="row">
      <div><strong>Not signed in</strong><div class="muted">You'll sign in with your company account.</div></div>
      <button id="signin">Sign in</button>
    </div>
    ${message ? `<p class="bad">${esc(message)}</p>` : ""}`;
  document.getElementById("signin").onclick = signIn;
}

async function renderSignedIn() {
  const me = await api("/v1/me");
  const { flows } = await api("/v1/flows");
  const chips = xs => xs.length ? xs.map(x => `<span class="chip">${esc(x)}</span>`).join("") : '<span class="muted">none</span>';
  app.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div><strong>${esc(me.name || me.email)}</strong><div class="muted">${esc(me.email)}</div></div>
      <button class="quiet" id="signout">Sign out</button>
    </div>
    <dl>
      <dt>Teams</dt><dd>${chips(me.teams)}</dd>
      <dt>Roles</dt><dd>${chips(me.roles)}</dd>
    </dl>`;
  const list = document.createElement("div");
  list.className = "card";
  list.innerHTML = `<h2>Flows you can see</h2>` + (flows.length
    ? `<ul>${flows.map(f => `<li><strong>${esc(f.name)}</strong> <span class="muted">· ${esc(f.flow_id)} · team ${esc(f.team || "unassigned")} · ${f.latest_version ? "v" + f.latest_version + " live" : "not published"}</span></li>`).join("")}</ul>`
    : `<p class="muted">No flows for your teams yet.</p>`);
  app.after(list);
  document.getElementById("signout").onclick = signOut;
}

(async () => {
  const params = new URLSearchParams(location.search);
  try {
    if (params.get("error")) throw new Error(params.get("error_description") || params.get("error"));
    if (params.get("code")) await finishSignIn(params);
    if (tokens) await renderSignedIn(); else renderSignedOut();
  } catch (e) {
    history.replaceState(null, "", "/");
    renderSignedOut(e.message);
  }
})();
</script>
</body>
</html>
