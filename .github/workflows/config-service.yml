name: Platform

# The platform services on EC2: config service (Go), Keycloak and Flow Studio
# (Caddy). Tests on every push and pull request that touches them; deploys on
# pushes to main. The voice agent has its own workflow (deploy.yml); a change to
# one doesn't redeploy the other.
on:
  push:
    branches: [main]
    paths:
      - "config-service/**"
      - "flow-studio/**"
      - "infra/docker-compose.yml"
      - "infra/keycloak/**"
      - "tests/flow_conformance.json"
      - "flows/**"
      - ".github/workflows/config-service.yml"
  pull_request:
    paths:
      - "config-service/**"
      - "flow-studio/**"
      - "infra/docker-compose.yml"
      - "infra/keycloak/**"
      - "tests/flow_conformance.json"
      - "flows/**"
      - ".github/workflows/config-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A throwaway database for the API tests.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cfgtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: config-service/go.mod
          cache-dependency-path: config-service/go.sum

      # Includes the conformance test: the Go validator must report exactly what
      # the Python one reports for every case in tests/flow_conformance.json.
      - name: Vet and test
        working-directory: config-service
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/cfgtest?sslmode=disable
        run: |
          test -z "$(gofmt -l .)" || { echo "Run gofmt -w on:"; gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./...

      - name: Docker images build
        run: |
          docker build -t config-service:ci config-service
          docker build -t studio:ci flow-studio

      - name: Keycloak setup script compiles
        run: python3 -m py_compile infra/keycloak/setup.py

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies config-service/, flow-studio/ and infra/ to /home/ubuntu on EC2.
      # Files that aren't in the repo (like infra/.env) are left alone.
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "config-service,flow-studio,infra"
          target: /home/ubuntu

      # Rebuilds what changed and restarts only those containers; unchanged ones
      # (LiteLLM, the databases) keep running. While the config service restarts
      # (a few seconds), calls use the agent's cached flow.
      - name: Rebuild and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/infra
            docker compose up -d --build
            for C in config-service keycloak; do
              S=starting
              for _ in $(seq 1 60); do
                S=$(docker inspect -f '{{.State.Health.Status}}' "$C")
                [ "$S" = healthy ] && break
                sleep 5
              done
              echo "$C: $S"
              if [ "$S" != healthy ]; then docker logs --tail 60 "$C"; exit 1; fi
            done
            docker compose ps
            docker image prune -f >/dev/null 2>&1 || true
