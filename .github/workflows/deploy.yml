name: Deploy Voice Agent to EC2

on:
  push:
    branches:
      - main
    # These have their own workflow (config-service.yml) and don't change the
    # agent image, so pushing only them doesn't redeploy the agent.
    paths-ignore:
      - "config-service/**"
      - "flow-studio/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/config-service.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stop here (no build, no deploy) if a flow file is broken or a test fails.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check flow files and run tests
        run: |
          pip install -r requirements-dev.txt
          python -m flow_engine flows/*.json
          pytest -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Each image is tagged with its commit SHA (for rollback) as well as "latest".
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inboundagent:latest
            ${{ secrets.DOCKER_USERNAME }}/inboundagent:${{ github.sha }}

      # Zero-downtime deploy:
      #   1. start the new container next to the old one
      #   2. wait until it has registered with LiveKit
      #   3. tell the old container to drain: it takes no new calls and finishes
      #      live ones (up to 900 s, matching drain_timeout in agent.py), then stops
      # Both containers register under the same agent name, so LiveKit sends
      # new calls only to the one that isn't draining.
      #
      # Rollback: re-run this workflow on an older commit, or on EC2 run the same
      # steps with the image tag of a previous commit SHA.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # This script runs directly on your EC2 instance
          script: |
            REPO="${{ secrets.DOCKER_USERNAME }}/inboundagent"
            SHA="${{ github.sha }}"
            IMAGE="$REPO:$SHA"
            NEW="inboundagent-${SHA:0:7}"

            docker pull "$IMAGE" || exit 1

            # Re-running the workflow for a commit that is already live: nothing to do.
            if docker ps --format '{{.Names}}' | grep -qx "$NEW"; then
              echo "$NEW is already running"
              exit 0
            fi
            docker rm "$NEW" >/dev/null 2>&1 || true

            # Containers to drain afterwards (the very first one is called "inboundagent").
            OLD=$(docker ps --filter "name=^inboundagent" --format '{{.Names}}' | grep -vx "$NEW" || true)

            # Join the platform network (from infra/docker-compose.yml) when it
            # exists, so the agent can reach LiteLLM at http://litellm:4000.
            NET_ARGS=""
            if docker network inspect voice-platform >/dev/null 2>&1; then
              NET_ARGS="--network voice-platform"
            fi

            # No host port is published (the old setup used -p 8081:8081), so the
            # old and new containers can run at the same time. --stop-timeout makes
            # any `docker stop` on this container wait for the drain by default.
            # --log-opt: rotate the container's logs so at most ~30 MB (3 x 10 MB) are
            # kept on disk; older lines are deleted automatically.
            # shellcheck disable=SC2086
            docker run -d \
              --name "$NEW" \
              --restart unless-stopped \
              --stop-timeout 900 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              $NET_ARGS \
              --env-file /home/ubuntu/VoiceAIAgent/.env \
              "$IMAGE" || exit 1

            # Wait up to 2 minutes for the new agent to register with LiveKit.
            READY=0
            for _ in $(seq 1 60); do
              if docker logs "$NEW" 2>&1 | grep -q "registered worker"; then
                READY=1
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$NEW")" != "true" ]; then
                break
              fi
              sleep 2
            done

            if [ "$READY" != "1" ]; then
              echo "New container did not register; keeping the old one running."
              docker logs --tail 80 "$NEW"
              docker rm -f "$NEW"
              exit 1
            fi
            echo "$NEW registered with LiveKit"

            # Drain the old containers in the background so this step doesn't wait 15 min.
            for C in $OLD; do
              echo "Draining $C (live calls get up to 15 minutes to finish)"
              nohup sh -c "docker stop -t 900 $C && docker rm $C" >/dev/null 2>&1 &
            done

            # Keep the 3 newest SHA-tagged images for rollback; delete older ones.
            # Images still used by a draining container fail to delete, which is fine.
            docker images "$REPO" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':latest$' | tail -n +4 | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
