name: Deploy Voice Agent to EC2

on:
  push:
    branches:
      - main # Triggers the pipeline when you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/outboundagent:latest

      - name: Deploy to EC2 and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # This script runs directly on your EC2 instance
          script: |
            # Pull the newly built image
            docker pull ${{ secrets.DOCKER_USERNAME }}/outboundagent:latest
            
            # Stop and remove the existing container if it is running
            docker stop outboundagent || true
            docker rm outboundagent || true
            
            # Run the new container, mounting your existing .env file
            docker run -d \
              --name outboundagent \
              --restart unless-stopped \
              --env-file /home/ubuntu/outbound/.env \
              -p 8081:8081 \
              ${{ secrets.DOCKER_USERNAME }}/outboundagent:latest
            
            # Clean up old unused images to save EC2 disk space
            docker image prune -af