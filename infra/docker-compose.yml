# Platform services that change rarely: LiteLLM (+ its Postgres) and the Go
# config service (+ its own Postgres). Keycloak and the UI get added here later.
#
# The voice agent is NOT in this file. It is deployed by
# .github/workflows/deploy.yml, which starts the new container before draining
# the old one so live calls aren't dropped (Compose would replace the container
# and cut them off). The agent joins this stack's "voice-platform" network and
# reaches LiteLLM at http://litellm:4000 and the config service at
# http://config-service:8080.
#
# First start, on EC2 inside this folder (config-service/ must sit next to it):
#   cp .env.example .env     # then fill in the values
#   docker compose up -d --build
name: voice-platform

services:
  litellm:
    # Pinned release; change the tag deliberately when upgrading.
    image: ghcr.io/berriai/litellm:v1.106.3
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?set it in .env}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set it in .env}
      # Used by LiteLLM's streaming Deepgram pass-through (/deepgram/v1/listen),
      # so speech-to-text also goes through LiteLLM.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set it in .env}
    ports:
      # Bound to 127.0.0.1: reachable from the EC2 machine itself (and through an
      # SSH tunnel for the admin UI), never from the internet.
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [voice-platform]

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [voice-platform]

  # Stores flows (prompts, nodes, guardrails), published versions and which
  # number runs which flow. The voice agent asks it at the start of each call.
  config-service:
    build: ../config-service
    image: voice-platform/config-service:local
    container_name: config-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${PLATFORM_DB_PASSWORD:?set it in .env}@platform-db:5432/platform?sslmode=disable
      ADMIN_TOKEN: ${CONFIG_ADMIN_TOKEN:?set it in .env}
      RUNTIME_TOKEN: ${CONFIG_RUNTIME_TOKEN:?set it in .env}
    ports:
      # Same as LiteLLM: only from the EC2 machine itself (or an SSH tunnel).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/config-service", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      platform-db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [voice-platform]

  # The config service's own database, separate from LiteLLM's, so each can be
  # upgraded, backed up or moved (e.g. to RDS) on its own.
  platform-db:
    image: postgres:16
    container_name: platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    networks: [voice-platform]

networks:
  voice-platform:
    # Fixed name so the agent container can join it with --network voice-platform.
    name: voice-platform

volumes:
  postgres_data:
  platform_db_data:
