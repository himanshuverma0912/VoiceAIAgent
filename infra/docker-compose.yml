# Platform services that change rarely:
#   studio          Caddy: the only public entry point (HTTPS), serves Flow Studio
#   keycloak        sign-in (SAML from the company directory, OIDC to Flow Studio)
#   config-service  flows, versions, numbers (Go) + platform-db (its Postgres;
#                   Keycloak keeps its own database in the same server)
#   litellm         LLM + Deepgram gateway + postgres (its own Postgres)
#   demo-bank       made-up core banking (MCP + REST) for test calls with tools
#
# The voice agent is NOT in this file. It is deployed by
# .github/workflows/deploy.yml, which starts the new container before draining
# the old one so live calls aren't dropped (Compose would replace the container
# and cut them off). The agent joins this stack's "voice-platform" network and
# reaches LiteLLM at http://litellm:4000 and the config service at
# http://config-service:8080.
#
# First start, on EC2 inside this folder (config-service/ must sit next to it):
#   cp .env.example .env     # then fill in the values
#   docker compose up -d --build
name: voice-platform

services:
  litellm:
    # Pinned release; change the tag deliberately when upgrading.
    image: ghcr.io/berriai/litellm:v1.106.3
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?set it in .env}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set it in .env}
      # Used by LiteLLM's streaming Deepgram pass-through (/deepgram/v1/listen),
      # so speech-to-text also goes through LiteLLM.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set it in .env}
    ports:
      # Bound to 127.0.0.1: reachable from the EC2 machine itself (and through an
      # SSH tunnel for the admin UI), never from the internet.
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [voice-platform]

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [voice-platform]

  # Stores flows (prompts, nodes, guardrails), published versions and which
  # number runs which flow. The voice agent asks it at the start of each call.
  config-service:
    build: ../config-service
    image: voice-platform/config-service:local
    container_name: config-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${PLATFORM_DB_PASSWORD:?set it in .env}@platform-db:5432/platform?sslmode=disable
      ADMIN_TOKEN: ${CONFIG_ADMIN_TOKEN:?set it in .env}
      RUNTIME_TOKEN: ${CONFIG_RUNTIME_TOKEN:?set it in .env}
      # People signed in to Flow Studio send Keycloak tokens; check them against
      # Keycloak's keys (fetched over the internal network).
      OIDC_ISSUER: https://${PUBLIC_HOST:?set it in .env}/auth/realms/voice-platform
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/voice-platform/protocol/openid-connect/certs
      # "Talk to this draft" in Flow Studio: browser test calls through LiveKit
      # Cloud (the same project and key as the agent). Leave empty to switch off.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Call history (counts and timings only, no call content) is deleted after this many days.
      CALL_RETENTION_DAYS: ${CALL_RETENTION_DAYS:-90}
      # The AI flow builder in Flow Studio calls an LLM through LiteLLM.
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      FLOW_BUILDER_MODEL: ${FLOW_BUILDER_MODEL:-flow-builder}
    ports:
      # Same as LiteLLM: only from the EC2 machine itself (or an SSH tunnel).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/config-service", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      platform-db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [voice-platform]

  # Sign-in. Browsers reach it at https://PUBLIC_HOST/auth (through studio);
  # the admin console only at http://localhost:8180/auth through an SSH tunnel.
  # Realms, clients and users are set up by keycloak/setup.py.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://platform-db:5432/keycloak
      KC_DB_USERNAME: platform
      KC_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
      KC_HTTP_ENABLED: "true" # TLS ends at Caddy
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${PUBLIC_HOST:?set it in .env}/auth
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # the config service reads keys via http://keycloak:8080
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # First start only: creates the "admin" user in the master realm.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it in .env}
    mem_limit: 1536m # Java takes up to 70% of this for its heap
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # Health is on the management port 9000 (never proxied). The image has no
      # curl, so bash talks HTTP itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [voice-platform]

  # Creates Keycloak's database in platform-db if it isn't there yet, then exits.
  keycloak-db-init:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: platform-db
      PGUSER: platform
      PGDATABASE: platform
      PGPASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
    entrypoint: ["sh", "-c"]
    command:
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || psql -c "CREATE DATABASE keycloak"
    depends_on:
      platform-db:
        condition: service_healthy
    networks: [voice-platform]

  # Caddy: HTTPS for PUBLIC_HOST (free certificate from Let's Encrypt, renewed
  # automatically), serving Flow Studio and passing /api and /auth on.
  # Needs ports 80 and 443 open in the EC2 security group.
  studio:
    build: ../flow-studio
    image: voice-platform/studio:local
    container_name: studio
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set it in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # certificates: keep them, or Let's Encrypt limits may bite
      - caddy_config:/config
    depends_on: [config-service, keycloak]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [voice-platform]

  # Demo core-banking server: made-up customers, so flows can use tools (card
  # balance, transactions, disputes) before the bank's real API is connected.
  # Reached only inside this network: http://demo-bank:8000/mcp (MCP) and
  # http://demo-bank:8000/api/... (REST). Register it once with
  # scripts/add-integration.sh infra/integrations/demo_bank.json
  demo-bank:
    build: ./demo-bank
    image: voice-platform/demo-bank:local
    container_name: demo-bank
    restart: unless-stopped
    environment:
      DEMO_BANK_TOKEN: ${DEMO_BANK_TOKEN:-} # empty: no token needed (it is only reachable inside this network)
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [voice-platform]

  # The config service's own database, separate from LiteLLM's, so each can be
  # upgraded, backed up or moved (e.g. to RDS) on its own.
  platform-db:
    image: postgres:16
    container_name: platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    networks: [voice-platform]

networks:
  voice-platform:
    # Fixed name so the agent container can join it with --network voice-platform.
    name: voice-platform

volumes:
  postgres_data:
  platform_db_data:
  caddy_data:
  caddy_config:
