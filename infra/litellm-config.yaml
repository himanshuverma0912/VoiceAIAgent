# Model aliases the agent can ask for. The agent only knows the alias
# (LLM_MODEL=voice-fast). To use a different real model, change it here and run
# `docker compose restart litellm`; the agent needs no redeploy.
model_list:
  - model_name: voice-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Flow Studio's AI flow builder ("Describe it"): turns a long written
  # description into a flow. Used only when building flows, never on calls, so
  # a stronger (slower, costlier) model is fine. gpt-5.6-sol (July 2026);
  # gpt-6.1-sol is newer. Change it here, then: docker compose up -d litellm
  - model_name: flow-builder
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
      timeout: 360

litellm_settings:
  # Don't pass message or response content to any logging callbacks.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Spend logs keep counts and cost only, never what was said.
  store_prompts_in_spend_logs: false
