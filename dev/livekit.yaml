# The local LiveKit server (dev/compose.yaml). Keys come from LIVEKIT_KEYS.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882 # one UDP port for all calls
  use_external_ip: false
  node_ip: 127.0.0.1 # what the browser (and the agent, sharing this network) connect to
logging:
  level: info
